version: 2

models:
  - name: stg_loans
    description: "Cleaned, deduplicated loan records from the raw Lending Club extract."
    columns:
      - name: loan_id
        description: "Surrogate key, deduplicated via row_number() to guarantee uniqueness."
        tests:
          - unique
          - not_null
      - name: loan_status
        tests:
          - not_null
          - accepted_values:
              values:
                - 'Fully Paid'
                - 'Charged Off'
                - 'Current'
                - 'Late (31-120 days)'
                - 'Late (16-30 days)'
                - 'In Grace Period'
                - 'Does not meet the credit policy. Status:Fully Paid'
                - 'Does not meet the credit policy. Status:Charged Off'
      - name: loan_amount
        tests:
          - not_null
      - name: interest_rate
        tests:
          - not_null