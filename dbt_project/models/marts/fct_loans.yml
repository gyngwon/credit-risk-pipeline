version: 2

models:
  - name: fct_loans
    description: "One row per loan. Grain: loan_id."
    columns:
      - name: loan_id
        tests:
          - unique
          - not_null
      - name: borrower_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_borrowers')
              field: borrower_id
      - name: credit_profile_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_credit_profile')
              field: credit_profile_id
      - name: product_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_loan_product')
              field: product_id
      - name: loan_amount
        tests:
          - not_null